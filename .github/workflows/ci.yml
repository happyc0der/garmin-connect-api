name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13", "3.14"]
        include:
          # Token paths, temp files and stdio all behave differently there.
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python }}
          # The runner's own Python is externally managed (3.12) or absent
          # (3.13), so everything installs into a venv that later steps use.
          activate-environment: true
      - name: Install
        # From uv.lock, so CI tests exactly the versions the lock file pins.
        run: uv sync --locked
      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        run: ruff check src tests && ruff format --check src tests
      - name: Types
        if: matrix.os == 'ubuntu-latest'
        run: mypy src
      # Offline only. The live tests skip themselves without GARMIN_LIVE=1 and
      # a login, and they must never run in CI against anyone's account.
      - name: Tests
        run: pytest tests -p no:warnings
      - name: Build
        if: matrix.os == 'ubuntu-latest'
        run: uv build && uvx twine check dist/*
