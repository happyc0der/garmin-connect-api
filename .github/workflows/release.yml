name: Release

# Push a tag like v0.1.0. The version in the tag, pyproject.toml and
# server.json must agree, or nothing is published.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      - name: Versions agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          project=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          server=$(python -c "import json;print(json.load(open('server.json'))['version'])")
          package=$(python -c "import json;print(json.load(open('server.json'))['packages'][0]['version'])")
          echo "tag=$tag pyproject=$project server=$server package=$package"
          test "$tag" = "$project" && test "$tag" = "$server" && test "$tag" = "$package"
      - name: Tests
        run: |
          uv pip install --system -e ".[dev]"
          ruff check src tests
          mypy src
          pytest tests -p no:warnings

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv build --no-sources
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    # Trusted publishing: no token. PyPI checks this repository, this
    # workflow file and this environment against its configured publisher.
    environment:
      name: pypi
      url: https://pypi.org/project/garmin-connect-api/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install mcp-publisher
        run: curl -sSfL https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz | tar xz mcp-publisher
      - name: Publish
        # The registry confirms ownership by reading the README on PyPI, which
        # can lag a fresh upload by a little, so it is retried a few times.
        run: |
          ./mcp-publisher login github-oidc
          for attempt in 1 2 3 4 5; do
            ./mcp-publisher publish && exit 0
            echo "Attempt $attempt failed; waiting for PyPI to catch up"
            sleep 30
          done
          exit 1

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
