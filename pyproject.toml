[project]
name = "garmin-connect-api"
version = "0.2.6"
description = "Read and write Garmin Connect from Python, HTTP or an MCP client: activities, strength sets, health data, workouts, weigh-ins"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "happyc0der" }]
requires-python = ">=3.12"
keywords = ["garmin", "garmin-connect", "mcp", "model-context-protocol", "fitness", "strength-training", "fit", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    # The unofficial client this wraps. Garmin's private endpoints move, and
    # 0.3.x has broken compatibility within minor versions before, so the
    # upper bound is deliberate: a new minor gets tested before it is allowed.
    "garminconnect>=0.3.19,<0.4",
    "pydantic>=2.9,<3",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "fastmcp>=4.0,<5",
    "fit-tool>=0.9.13,<1",
    "typer>=0.15",
    # The upload routes take multipart forms; FastAPI needs this to parse them.
    "python-multipart>=0.0.20",
    # Timezone names, on systems without their own database (Windows, slim
    # Linux images): an account's timezone must be loadable to place times.
    "tzdata>=2024.1",
]

[project.urls]
Homepage = "https://github.com/happyc0der/garmin-connect-api"
Repository = "https://github.com/happyc0der/garmin-connect-api"
Issues = "https://github.com/happyc0der/garmin-connect-api/issues"
Changelog = "https://github.com/happyc0der/garmin-connect-api/blob/main/CHANGELOG.md"

[project.scripts]
# `uvx garmin-connect-api` starts the MCP server over stdio, as MCP clients
# expect; `garmin` is the full command line, including `garmin login`.
garmin-connect-api = "garmin_api.cli:mcp_entry"
garmin = "garmin_api.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
# Development tools: installed by `uv sync`, never published with the package.
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx>=0.27",  # FastAPI's TestClient
    "jsonschema>=4.23",
    # Lets jsonschema check the "date-time" format, as strict MCP clients do.
    "rfc3339-validator>=0.1.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_api"]

[tool.hatch.build.targets.sdist]
# Tests travel with the source; the live ones skip themselves without a login.
include = ["src/garmin_api", "tests", "examples", "README.md", "LICENSE", "CHANGELOG.md", "SECURITY.md", "CITATION.cff", "server.json"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
# FastAPI's whole parameter style is calls in argument defaults (Query, Body,
# File). B008 exists for mutable defaults, which these are not.
"src/garmin_api/http/routers/*.py" = ["B008"]
"src/garmin_api/cli.py" = ["B008"]
