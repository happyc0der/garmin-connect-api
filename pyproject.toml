[project]
name = "garmin-connect-api"
version = "0.1.0"
description = "A read/write API for Garmin Connect: typed library, local HTTP service, and MCP server"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "garminconnect>=0.3.16",
    "pydantic>=2.9",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "fastmcp>=4.0",
    "fit-tool>=0.9.13",
    "typer>=0.15",
    "httpx>=0.27",
]

[project.scripts]
garmin = "garmin_api.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
# FastAPI's whole parameter style is calls in argument defaults (Query, Body,
# File). B008 exists for mutable defaults, which these are not.
"src/garmin_api/http/routers/*.py" = ["B008"]
"src/garmin_api/cli.py" = ["B008"]
